<title>Pingu 的小世界 · 给陈俊贤</title>
<style>
/* ============ 基础 ============ */
:root{
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  --bg1:#ffe9c7;--bg2:#ffc184;--ink:#3c2a19;--panel:rgba(255,255,255,.55);--line:rgba(255,255,255,.7);
  --accent:#ff7a2f;
  color:var(--ink);background:var(--bg1);
}
body[data-scene="study"]{--bg1:#eef4ff;--bg2:#c2d6ff;--ink:#25304a;--accent:#5b8def}
body[data-scene="sleep"]{--bg1:#101a3a;--bg2:#2c3c76;--ink:#eef2ff;--panel:rgba(255,255,255,.13);--line:rgba(255,255,255,.22);--accent:#a8bcff}
body[data-scene="play"]{--bg1:#eefaff;--bg2:#b9e8ff;--ink:#17394a;--accent:#17b3c9}
body[data-scene="birthday"]{--bg1:#ffe8f3;--bg2:#ffb9d6;--ink:#4a1f37;--accent:#ff4f8b}

#app{
  position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:linear-gradient(168deg,var(--bg1) 0%,var(--bg2) 100%);
  transition:background .7s ease;
}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.42),transparent 62%);
  opacity:.9;transition:opacity .7s;
}
body[data-scene="sleep"] #app::before{opacity:.14}

/* ============ 顶部 ============ */
#topbar{
  position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:calc(8px + var(--safe-t)) 14px 4px;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;letter-spacing:.3px;white-space:nowrap}
.brand .peng{font-size:21px;line-height:1;animation:pengBob 3s ease-in-out infinite}
.hstats{display:flex;align-items:center;gap:6px;min-width:0}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:7px 10px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap;font-family:inherit;
  transition:transform .15s, background .3s;
}
button.chip{appearance:none;cursor:pointer}
button.chip:active{transform:scale(.93)}
#micBtn{font-size:14px;padding:7px 8px}
#micBtn.listening{background:#ff5f7e;color:#fff;animation:pulse 1s infinite}

/* ============ 舞台 ============ */
#stageWrap{position:relative;z-index:4;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 6px}
#stage{position:relative;width:min(92vw,460px);height:min(92vw,460px);max-height:100%;transition:opacity .2s ease,transform .2s ease}
#stage.swap-out{opacity:0;transform:scale(.94)}
#stage.swap-in{animation:swapIn .4s cubic-bezier(.2,1,.3,1)}
@keyframes swapIn{from{opacity:0;transform:translateX(16px) scale(.96)}to{opacity:1;transform:none}}
#bgArt,#frontArt{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;overflow:hidden}
#frontArt{z-index:3}
#pinguWrap{position:absolute;left:50%;bottom:0;z-index:2;transform:translateX(-50%);pointer-events:none;will-change:transform}
#pinguWrap img{display:none;width:auto;max-width:none;transform-origin:50% 100%;will-change:transform}
#pinguWrap img.on{display:block}
#fx{position:absolute;inset:0;z-index:4;width:100%;height:100%;pointer-events:none}

/* 对话气泡 */
#bubble{
  position:absolute;left:50%;top:1.5%;z-index:5;max-width:84%;
  transform:translate(-50%,-26px);opacity:0;pointer-events:none;
  background:rgba(255,255,255,.97);color:#3a2a1c;
  padding:9px 16px;border-radius:18px;font-size:clamp(13px,3.7vw,17px);font-weight:800;
  line-height:1.35;text-align:center;white-space:pre-line;
  box-shadow:0 12px 26px rgba(70,45,20,.2);transition:opacity .3s ease,transform .5s cubic-bezier(.2,1.2,.4,1);
}
#bubble.show{opacity:1;transform:translate(-50%,0)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:13px;height:13px;background:inherit;border-radius:3px;transform:translateX(-50%) rotate(45deg)}

/* ============ 底部控制 ============ */
#hud{
  position:relative;z-index:6;display:flex;flex-direction:column;gap:6px;
  padding:4px 14px calc(10px + var(--safe-b));
}
#hudRow{display:flex;align-items:center;gap:clamp(10px,3.5vw,18px)}
#pad{
  position:relative;flex:none;width:clamp(106px,29vw,146px);aspect-ratio:1/1;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.62),rgba(255,255,255,.16) 70%);
  border:1.5px solid var(--line);
  box-shadow:0 10px 30px rgba(90,50,10,.14),inset 0 0 26px rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;touch-action:none;overflow:hidden;
  transition:transform .15s, box-shadow .25s, background .5s;
}
body[data-scene="sleep"] #pad{box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 26px rgba(255,255,255,.12)}
#pad.pressing{transform:scale(.955);box-shadow:0 6px 20px rgba(255,120,30,.3),inset 0 0 34px rgba(255,180,90,.5)}
.pad-ring{position:absolute;inset:13%;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);animation:spin 16s linear infinite;pointer-events:none}
.pad-ring.r2{inset:26%;border-style:solid;border-color:rgba(255,255,255,.34);animation-direction:reverse;animation-duration:11s}
.pad-center{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;pointer-events:none;text-align:center}
.pad-icon{font-size:clamp(17px,4.6vw,22px);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.pad-label{font-size:clamp(9px,2.5vw,11px);font-weight:900;letter-spacing:.5px;opacity:.85;line-height:1.2;margin-top:2px}
.pad-count{display:flex;gap:3px;margin-top:4px}
.pad-count i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55);transition:transform .12s,background .12s}
.pad-count i.on{background:var(--accent);transform:scale(1.55)}
.ripple{
  position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);
  pointer-events:none;animation:ripple .7s ease-out forwards;
}
@keyframes ripple{from{transform:scale(.3);opacity:.95}to{transform:scale(2.1);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,95,126,.6)}50%{box-shadow:0 0 0 8px rgba(255,95,126,0)}}

#info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
#sceneName{font-size:clamp(17px,4.8vw,22px);font-weight:900;letter-spacing:.5px;line-height:1.15;transition:color .4s}
#sceneTip{font-size:clamp(11px,3.1vw,13px);font-weight:700;line-height:1.4;opacity:.78}
#swipeHint{font-size:clamp(10px,2.8vw,11.5px);font-weight:700;opacity:.5;margin-top:1px}

#nav{display:flex;justify-content:center;gap:5px;padding:0 2px}
#nav button{
  appearance:none;border:1px solid var(--line);background:var(--panel);font-family:inherit;color:var(--ink);
  flex:1;max-width:74px;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:5px 2px 4px;border-radius:13px;cursor:pointer;transition:transform .16s,box-shadow .2s,background .3s;
}
#nav button .emo{font-size:17px;line-height:1.1}
#nav button .lab{font-size:9.5px;font-weight:800;opacity:.62;letter-spacing:.3px;white-space:nowrap}
#nav button.on{background:#fff;box-shadow:0 6px 16px rgba(80,50,20,.18);transform:translateY(-2px)}
#nav button.on .lab{opacity:1;color:var(--accent)}
#nav button:active{transform:scale(.94)}

/* ============ 开场 ============ */
#welcome{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% 32%,rgba(255,221,170,.9),rgba(255,150,80,.62));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  transition:opacity .45s ease,visibility .45s;
}
#welcome.hide{opacity:0;visibility:hidden;pointer-events:none}
.card{
  width:min(92vw,372px);background:rgba(255,255,255,.95);border-radius:27px;padding:22px 20px 18px;
  text-align:center;box-shadow:0 26px 70px rgba(120,55,0,.32);
  animation:cardIn .5s cubic-bezier(.18,1.3,.4,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.card .bigpeng{font-size:56px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.2));animation:pengBob 2.6s ease-in-out infinite}
.card h1{font-size:21px;margin:10px 0 6px;letter-spacing:.5px;color:#3a2a1c}
.card .sub{font-size:13px;line-height:1.65;color:#7d6552;margin-bottom:14px}
.card .sub b{color:#e2622b}
#startBtn{
  width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900;color:#fff;font-family:inherit;
  background:linear-gradient(135deg,#ff9a3d,#ff5f7e);box-shadow:0 12px 26px rgba(255,95,126,.42);cursor:pointer;
  transition:transform .14s;
}
#startBtn:active{transform:scale(.97)}
.hints{display:grid;gap:6px;margin-top:14px;font-size:11.5px;color:#8a7462;text-align:left;font-weight:700}
.hints span{display:flex;gap:7px;align-items:center;background:#fff5e8;border-radius:11px;padding:7px 9px}
.card .from{margin-top:12px;font-size:11px;font-weight:800;color:#bda48d;letter-spacing:.5px}

/* ============ 提示 & 错误 ============ */
#toast{
  position:fixed;left:50%;bottom:27%;z-index:25;transform:translate(-50%,10px);
  background:rgba(40,28,22,.9);color:#fff;font-size:13px;font-weight:800;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#e03131;color:#fff;font-size:11px;padding:4px 8px;white-space:pre-wrap}

/* ============ 动画 ============ */
@keyframes pengBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes flameFlick{from{transform:scale(1,1) translateY(0)}to{transform:scale(.82,1.2) translateY(-1.5px)}}
@keyframes smokeUp{0%{opacity:.7;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-42px) scale(1.4)}}
@keyframes zzzFloat{0%{opacity:0;transform:translate(0,0) scale(.7)}25%{opacity:.95}100%{opacity:0;transform:translate(20px,-46px) scale(1.3)}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

#frontArt #flames{transition:opacity .35s}
#frontArt #flames.out{opacity:0}
#frontArt #flames ellipse{transform-box:fill-box;transform-origin:center bottom;animation:flameFlick .85s ease-in-out infinite alternate}
#frontArt #flames ellipse:nth-child(2n){animation-duration:1.05s}
#frontArt #flames ellipse:nth-child(3n){animation-duration:.7s}
#frontArt #smoke{opacity:0;transition:opacity .2s}
#frontArt #smoke.show{opacity:1}
#frontArt #smoke path{animation:smokeUp 1.9s ease-out forwards}
#frontArt #zzz text{transform-box:fill-box;transform-origin:center;animation:zzzFloat 3s ease-out infinite;opacity:0}
#frontArt #zzz text:nth-child(2){animation-delay:1s}
#frontArt #zzz text:nth-child(3){animation-delay:2s}
#bgArt .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
#bgArt .tw:nth-child(2n){animation-delay:.7s}
#bgArt .tw:nth-child(3n){animation-delay:1.5s}
#frontArt #blanket.pat{animation:patBed .55s ease-in-out;transform-box:fill-box;transform-origin:center bottom}
@keyframes patBed{0%,100%{transform:scaleY(1)}45%{transform:scaleY(.94)}}

/* 横屏适配 */
@media (orientation:landscape) and (max-height:520px){
  #topbar{padding-top:calc(4px + var(--safe-t))}
  .brand{font-size:13px}
  #hud{flex-direction:row;align-items:center;padding-bottom:calc(6px + var(--safe-b))}
  #hudRow{flex:1}
  #pad{width:92px}
  #info{gap:2px}
  #sceneTip{display:none}
  #nav{width:auto;flex:0 0 auto}
  #nav button{max-width:56px}
  #bubble{top:0;font-size:13px;padding:7px 12px}
}
@media (max-width:374px){
  #topbar{padding-left:10px;padding-right:10px;gap:4px}
  .brand{font-size:13px;gap:5px}
  .brand .peng{font-size:18px}
  .chip{font-size:11px;padding:6px 8px}
  #micBtn{display:none!important}
  .hstats{gap:4px}
}
@media (max-height:560px){
  #welcome{padding:10px}
  .card{padding:14px 16px 12px;max-height:96vh;overflow:auto}
  .card .bigpeng{font-size:34px}
  .card h1{font-size:17px;margin:6px 0 4px}
  .card .sub{font-size:11.5px;margin-bottom:10px;line-height:1.5}
  #startBtn{padding:11px;font-size:14px;border-radius:13px}
  .hints{margin-top:8px;font-size:10px;gap:4px}
  .hints span{padding:5px 7px}
  .card .from{margin-top:8px}
}
@media (max-width:345px){
  #nav button .lab{display:none}
  #hud{padding-left:10px;padding-right:10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;animation-iteration-count:1 !important}
}
</style>
</head>

<script>/* 农历 → 公历（用于「农历九月廿八」生日）
 * 算法：Meeus 朔望月 + 太阳视黄经，按「冬至所在月为十一月、无中气置闰」规则。
 * 只依赖公历日期，不依赖设备时区（全部按北京时间 UTC+8 计算）。
 */
(function (global) {
  var RAD = Math.PI / 180, SYN = 29.530588861;
  var DELTA_T = 69 / 86400; // 2020s 的 ΔT 约 69 秒

  function jdFromBJ(y, m, d) { // 北京时间某日 00:00 的 JD(UT)
    return Date.UTC(y, m - 1, d) / 86400000 + 2440587.5 - 8 / 24;
  }
  function bjDayNumber(jd) { // 该时刻对应的北京日期序号（整数天）
    return Math.floor((jd + 8 / 24 - 2440587.5) * 86400000 / 86400000 + 1e-9);
  }
  function bjFromDayNumber(n) {
    var dt = new Date(n * 86400000);
    return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
  }
  function todayBJDayNumber() {
    var dt = new Date(Date.now() + 8 * 3600000);
    return Math.floor(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()) / 86400000);
  }

  function newMoonJD(k) {

    var jde = 2451550.09766 + SYN * k + 0.00015437 * T * T
      - 0.000000150 * T * T * T + 0.00000000073 * T * T * T * T;
    var E = 1 - 0.002516 * T - 0.0000074 * T * T;
    var M = 2.5534 + 29.10535670 * k - 0.0000014 * T * T - 0.00000011 * T * T * T;
    var Mp = 201.5643 + 385.81693528 * k + 0.0107582 * T * T + 0.00001238 * T * T * T - 0.000000058 * T * T * T * T;
    var F = 160.7108 + 390.67050284 * k - 0.0016118 * T * T - 0.00000227 * T * T * T + 0.000000011 * T * T * T * T;
    var Om = 124.7746 - 1.56375588 * k + 0.0020672 * T * T + 0.00000215 * T * T * T;
    var d = -0.40720 * Math.sin(Mp * RAD)
      + 0.17241 * E * Math.sin(M * RAD)
      + 0.01608 * Math.sin(2 * Mp * RAD)
      + 0.01039 * Math.sin(2 * F * RAD)
      + 0.00739 * E * Math.sin((Mp - M) * RAD)
      - 0.00514 * E * Math.sin((Mp + M) * RAD)
      + 0.00208 * E * E * Math.sin(2 * M * RAD)
      - 0.00111 * Math.sin((Mp - 2 * F) * RAD)
      - 0.00057 * Math.sin((Mp + 2 * F) * RAD)
      + 0.00056 * E * Math.sin((2 * Mp + M) * RAD)
      - 0.00042 * Math.sin(3 * Mp * RAD)
      + 0.00042 * E * Math.sin((M + 2 * F) * RAD)
      + 0.00038 * E * Math.sin((M - 2 * F) * RAD)
      - 0.00024 * E * Math.sin((2 * Mp - M) * RAD)
      - 0.00017 * Math.sin(Om * RAD)
      - 0.00007 * Math.sin((Mp + 2 * M) * RAD)
      + 0.00004 * Math.sin((2 * Mp - 2 * F) * RAD)
      + 0.00004 * Math.sin(3 * M * RAD)
      + 0.00003 * Math.sin((Mp + M - 2 * F) * RAD)
      + 0.00003 * Math.sin((2 * Mp + 2 * F) * RAD)
      - 0.00003 * Math.sin((Mp + M + 2 * F) * RAD)
      + 0.00003 * Math.sin((Mp - M + 2 * F) * RAD)
      - 0.00002 * Math.sin((Mp - M - 2 * F) * RAD)
      - 0.00002 * Math.sin((3 * Mp + M) * RAD)
      + 0.00002 * Math.sin(4 * Mp * RAD);
    var P = [
      [299.77 + 0.107408 * k - 0.009173 * T * T, 0.000325],
      [251.88 + 0.016321 * k, 0.000165],
      [251.83 + 26.651886 * k, 0.000164],
      [349.42 + 36.412478 * k, 0.000126],
      [84.66 + 18.206239 * k, 0.000110],
      [141.74 + 53.303771 * k, 0.000062],
      [207.14 + 2.453732 * k, 0.000060],
      [154.84 + 7.306860 * k, 0.000056],
      [34.52 + 27.261239 * k, 0.000047],
      [207.19 + 0.121824 * k, 0.000042],
      [291.34 + 1.844379 * k, 0.000040],
      [161.72 + 24.198154 * k, 0.000037],
      [239.56 + 25.513099 * k, 0.000035],
      [331.55 + 3.592518 * k, 0.000023]
    ];

  function sunLon(jd) {
    var T = (jd - 2451545.0) / 36525;
    var L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    var M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    var C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * RAD)
      + (0.019993 - 0.000101 * T) * Math.sin(2 * M * RAD)
      + 0.000289 * Math.sin(3 * M * RAD);

    return (L0 + C - 0.00569 - 0.00478 * Math.sin(Om * RAD)) % 360;
  }
  function solarTermJD(guessJD, target) {
    var jd = guessJD;
    for (var i = 0; i < 20; i++) {

    }
    return jd - DELTA_T;
  }

  // 从 y-1 年冬至所在月（十一月）开始的一个农历年
  function sui(y) {

    var ws2 = solarTermJD(jdFromBJ(y, 12, 21), 270);
    var kEst = Math.floor((ws1 - 2451550.09766) / SYN);
    var m11 = -1e9, m11n = -1e9, k, t;
    for (k = kEst - 2; k <= kEst + 2; k++) {
      t = newMoonJD(k);
      if (t <= ws1 && t > m11) m11 = t;
    }
    var k2 = Math.floor((ws2 - 2451550.09766) / SYN);
    for (k = k2 - 2; k <= k2 + 2; k++) {
      t = newMoonJD(k);
      if (t <= ws2 && t > m11n) m11n = t;
    }
    var kStart = Math.round((m11 - 2451550.09766) / SYN);
    var kEnd = Math.round((m11n - 2451550.09766) / SYN);
    var starts = [];
    for (k = kStart; k <= kEnd; k++) starts.push(newMoonJD(k));
    // 中气
    var zhongqi = [];
    for (var i = 0; i <= 12; i++) {
      var target = (270 + 30 * i) % 360;
      zhongqi.push(solarTermJD(ws1 + i * 30.44, target));
    }
    var leapIdx = -1;
    if (starts.length - 1 === 13) {
      for (i = 0; i < 13; i++) {
        var has = false;
        for (var j = 0; j < zhongqi.length; j++) {
          if (zhongqi[j] >= starts[i] && zhongqi[j] < starts[i + 1]) { has = true; break; }
        }
        if (!has) { leapIdx = i; break; }
      }
    }
    var months = [], num = 11;
    for (i = 0; i < starts.length - 1; i++) {
      if (leapIdx === i) {
        months.push({ start: starts[i], leap: true, num: num });
      } else {
        months.push({ start: starts[i], leap: false, num: num });
        num = num % 12 + 1;
      }
    }
    return months;
  }

  function lunarYearMonths(y) {
    var ms = sui(y), idx = -1, i;
    for (i = 0; i < ms.length; i++) {
      if (ms[i].num === 1 && !ms[i].leap) { idx = i; break; }
    }
    return ms.slice(idx);
  }

  // 农历 y 年 m 月 d 日 => {y,m,d}

  var out = "", colors = ["#ff8fab", "#ffd166", "#8ecae6", "#a0e7a0", "#ffb4a2"];
  for (var i = 0; i < 13; i++){
    var x = 10 + i * 31;
    var y = 34 + Math.sin(i / 12 * Math.PI) * 22;
    out += '<path d="M' + x + ' ' + y + ' l15 2 l-8 19 z" fill="' + colors[i % 5] + '" opacity=".95"/>';
  }
  return out;
}
function candles(){
  var out = "";
  for (var i = 0; i < 11; i++){
    var x = 156 + i * 8.6;
    var c = ["#ff8fab", "#8ecae6", "#ffd166", "#a0e7a0"][i % 4];
    out += '<rect x="' + x + '" y="295" width="4.4" height="19" rx="2" fill="' + c + '"/>';
    out += '<rect x="' + (x - .8) + '" y="292" width="6" height="4" rx="1.5" fill="#fff" opacity=".7"/>';
  }
  return out;
}
function flames(){
  var out = "";
  for (var i = 0; i < 11; i++){
    var x = 156 + i * 8.6;
    out += '<ellipse cx="' + (x + 2.2) + '" cy="287" rx="3.1" ry="5.6" fill="#ffcf4d"/>';
    out += '<ellipse cx="' + (x + 2.2) + '" cy="289" rx="1.5" ry="2.8" fill="#fff3b0"/>';
  }
  return out;
}

function shadowSVG(cx, cy, rx){
  return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + Math.round(rx * .16) + '" fill="#000" opacity=".15"/>';
}

/* ===================== 动作动画 ===================== */
function easeOutQuad(p){ return p * (2 - p); }
function poseAt(keys, t){
  var k0 = keys[0], k1 = keys[keys.length - 1];
  for (var i = 0; i < keys.length - 1; i++){
    if (t <= keys[i + 1].t){ k0 = keys[i]; k1 = keys[i + 1]; break; }
    if (i === keys.length - 2){ k0 = keys[keys.length - 1]; k1 = k0; }
  }
  var span = k1.t - k0.t;
  var p = span > 0 ? clamp((t - k0.t) / span, 0, 1) : 1;
  p = easeOutQuad(p);
  return {
    x: k0.p.x + (k1.p.x - k0.p.x) * p,
    y: k0.p.y + (k1.p.y - k0.p.y) * p,
    r: k0.p.r + (k1.p.r - k0.p.r) * p,
    sx: k0.p.sx + (k1.p.sx - k0.p.sx) * p,
    sy: k0.p.sy + (k1.p.sy - k0.p.sy) * p
  };
}
function applyPose(){
  var p = S.pose, unit = S.size.unit || 1;
  imgs[S.scene].style.transform =
    "translate(" + (p.x * unit).toFixed(2) + "px," + (p.y * unit).toFixed(2) + "px) " +
    "rotate(" + p.r.toFixed(2) + "deg) scale(" + p.sx.toFixed(3) + "," + p.sy.toFixed(3) + ")";
}
function invalidatePose(){ applyPose(); }

function clearTimers(){
  timers.forEach(function(t){ clearTimeout(t); });
  timers = [];
}
function runAction(action){
  clearTimers();
  S.anim = { start: now(), dur: action.dur, keys: action.keys };
  (action.sounds || []).forEach(function(s){
    timers.push(setTimeout(function(){ sfx(s[1]); }, s[0] * 1000));
  });
  (action.fx || []).forEach(function(f){
    timers.push(setTimeout(function(){ sceneFx(f[1]); }, f[0] * 1000));
  });
}

function triggerPhase(force){
  if (S.transitioning) return;
  var t = now();
  if (!force && t - (S.lastTrigger || 0) < 260) return;
  S.lastTrigger = t;
  var sc = SCENES[S.scene].id;
  S.phase = (S.phase + 1) % 2;
  runAction(ACTIONS[sc][S.phase]);
  vibrate(9);
  if (Math.random() < .32) say(pick(SCENES[S.scene].lines));
}
function greetAction(){
  clearTimers();
  S.anim = { start: now(), dur: GREET_ACTION.dur, keys: GREET_ACTION.keys };
  GREET_ACTION.sounds.forEach(function(s){ timers.push(setTimeout(function(){ sfx(s[1]); }, s[0] * 1000)); });
  GREET_ACTION.fx.forEach(function(f){ timers.push(setTimeout(function(){ sceneFx(f[1]); }, f[0] * 1000)); });
}

/* ===================== 场景切换 ===================== */
function renderScene(i, opts){
  opts = opts || {};
  S.scene = i;
  var sc = SCENES[i];
  body.dataset.scene = sc.id;
  bgArt.innerHTML = bgHTML(sc.id);
  frontArt.innerHTML = frontHTML(sc.id);
  imgs.forEach(function(im, k){ im.classList.toggle("on", k === i); });
  pinguWrap.style.display = "block";
  S.pose = {x:0,y:0,r:0,sx:1,sy:1};
  S.anim = null;
  S.phase = -1;
  S.lastTrigger = 0;
  S.blow[sc.id] = false;
  clearTimers();
  layoutPingu();
  applyPose();
  sceneName.textContent = sc.name;
  sceneTip.textContent = sc.tip;
  if (metaTheme) metaTheme.setAttribute("content", THEME[sc.id] || "#ffd9a0");
  Array.prototype.forEach.call(nav.children, function(b, k){ b.classList.toggle("on", k === i); });
  if (!opts.silent) say(sc.lines[0], true);
}
function buildNav(){
  SCENES.forEach(function(sc, i){
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="emo">' + sc.emo + '</span><span class="lab">' + sc.name + '</span>';
    b.setAttribute("aria-label", sc.name);
    b.addEventListener("click", function(e){ e.stopPropagation(); unlock(); goScene(i); });
    nav.appendChild(b);
  });
}
function goScene(i, silent){
  i = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  if (S.transitioning || i === S.scene) return;
  S.transitioning = true;
  stage.classList.add("swap-out");
  sfx("ding");
  setTimeout(function(){
    renderScene(i, { silent: silent });
    stage.classList.remove("swap-out");
    stage.classList.add("swap-in");
    setTimeout(function(){ stage.classList.remove("swap-in"); S.transitioning = false; }, 400);
  }, 200);
}

/* ===================== 手势 ===================== */
function padLocal(e){
  var r = pad.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
var padGesture = { id: null, fired: false, last: 0, pts: new Map() };
function refreshPadDots(){
  var n = padGesture.pts.size;
  var dots = pad.querySelectorAll(".pad-count i");
  for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < n);
  pad.classList.toggle("pressing", n > 0);
}
function padDown(e){
  if (padGesture.pts.size >= 5) return;
  e.preventDefault();
  unlock();
  var first = padGesture.pts.size === 0;
  try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  var p = padLocal(e);
  padGesture.pts.set(e.pointerId, { x: p.x, y: p.y });
  if (first) padGesture.fired = false;
  var rp = document.createElement("span");
  rp.className = "ripple";
  rp.style.left = p.x + "px"; rp.style.top = p.y + "px";
  pad.appendChild(rp);
  setTimeout(function(){ rp.remove(); }, 750);
  SND.note(padGesture.pts.size);
  vibrate(7);
  refreshPadDots();
  // 一次手势只触发一次
  if (!padGesture.fired){ padGesture.fired = true; triggerPhase(); }
}
function padMove(e){
  if (!padGesture.pts.has(e.pointerId)) return;
  var p = padLocal(e);
  padGesture.pts.set(e.pointerId, { x: p.x, y: p.y });
  if (!padGesture.fired){ padGesture.fired = true; triggerPhase(); }
}
function padUp(e){
  if (!padGesture.pts.has(e.pointerId)) return;
  padGesture.pts.delete(e.pointerId);
  if (padGesture.pts.size === 0) padGesture.fired = false;
  refreshPadDots();
}

/* 舞台轻点 / 左右滑动 */
var swipe = null;
function stageDown(e){
  if (e.target.closest("#pad")) return;
  unlock();
  swipe = { id: e.pointerId, x: e.clientX, y: e.clientY, t: now(), moved: 0 };
}
function stageMove(e){
  if (!swipe || e.pointerId !== swipe.id) return;
  swipe.moved = Math.max(swipe.moved, Math.hypot(e.clientX - swipe.x, e.clientY - swipe.y));
}
function stageUp(e){
  if (!swipe || e.pointerId !== swipe.id) return;
  var s = swipe; swipe = null;
  var dx = e.clientX - s.x, dy = e.clientY - s.y;
  var dt = now() - s.t;
  if (Math.abs(dx) > 52 && Math.abs(dx) > Math.abs(dy) * 1.25){
    goScene(S.scene + (dx < 0 ? 1 : -1));
    vibrate(10);
    return;
  }
  if (s.moved < 14 && dt < 600){
    // 点生日蛋糕可以吹蜡烛，其余位置触发动作
    if (SCENES[S.scene].id === "birthday" && tapOnCake(e)) blowCandles();
    else triggerPhase();
  }
}
function tapOnCake(e){
  var c = document.querySelector("#cake");
  if (!c) return false;
  var b = c.getBoundingClientRect();
  return e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
}
function stageCancel(){ swipe = null; }

/* ===================== 打招呼 ===================== */
function greet(){
  unlock();
  greetAction();
  say("你好，" + CONFIG.name + "！", true, 5200);
  SND.hum();
  speak("你好，" + CONFIG.name + "。");
  fxEmit("heart", 200, 240, 10, { spread: 90, speed: .9, up: 90, g: 50, life: 1.4 });
  fxEmit("sparkle", 200, 220, 8, { spread: 130, speed: 1, up: 60, g: 30, life: 1.3 });
  vibrate(14);
}

/* 语音识别：仅 https/localhost 且浏览器支持 */
function setupMic(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || !window.isSecureContext) return;
  var btn = $("#micBtn");
  btn.hidden = false;
  var rec = null, listening = false, timer = null;
  function stop(){
    listening = false;
    btn.classList.remove("listening");
    clearTimeout(timer);
    if (rec) { try { rec.stop(); } catch (e) {} }
  }
  btn.addEventListener("click", function(){
    unlock();
    if (listening) { stop(); return; }
    try { rec = new SR(); } catch (e) { showToast("这个浏览器不支持语音识别"); return; }
    rec.lang = "zh-CN";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onstart = function(){
      listening = true;
      btn.classList.add("listening");
      showToast("🎤 说「你好」或「生日快乐」");
      timer = setTimeout(stop, 8000);
    };
    rec.onresult = function(ev){
      var text = "";
      for (var i = 0; i < ev.results.length; i++) text += ev.results[i][0].transcript;
      stop();
      if (/生日快乐/.test(text)){ easterEgg(); return; }
      if (/你好|哈喽|嗨|hello|hi|早上好|晚上好/i.test(text) || text.length <= 4){ greet(); }
      else showToast("听到：「" + text + "」");
    };
    rec.onerror = function(){ stop(); showToast("没有听清，点「👋 打招呼」也可以"); };
    rec.onend = function(){ listening = false; btn.classList.remove("listening"); clearTimeout(timer); };
    try { rec.start(); } catch (e) { showToast("麦克风没有启动成功"); }
  });
}

/* ===================== 主循环 ===================== */
var lastT = 0, ambT = 0;
function loop(ts){
  var dt = lastT ? Math.min((ts - lastT) / 1000, .05) : .016;
  lastT = ts;
  S.t += dt;
  if (S.anim){
    var elapsed = (now() - S.anim.start) / 1000;
    if (elapsed >= S.anim.dur){
      S.pose = poseAt(S.anim.keys, S.anim.dur);
      S.anim = null;
    } else {
      S.pose = poseAt(S.anim.keys, elapsed);
    }
    applyPose();
  }
  // 环境粒子
  ambT += dt;
  if (ambT > .5){
    ambT = 0;
    var id = SCENES[S.scene].id;
    if (id === "play") fxEmit("snow", Math.random() * 400, -8, 1, { spread: 6, speed: .3, g: 26, life: 4.5, size: 3 });
    if (id === "birthday") fxEmit("sparkle", 40 + Math.random() * 320, 70 + Math.random() * 90, 1, { spread: 8, speed: .2, g: 8, life: 1.8, size: 2.2 });
    if (id === "sleep") fxEmit("sparkle", 40 + Math.random() * 320, 60 + Math.random() * 90, 1, { spread: 6, speed: .15, g: 0, life: 2.4, size: 1.8, color: "#dfe8ff" });
  }
  drawFX(dt);
  requestAnimationFrame(loop);
}

/* ===================== 农历生日 ===================== */
function updateDays(){
  var info;
  try {
    info = LunarBirthday.nextBirthday();
  } catch (e) {
    daysEl.textContent = "🎂 生日";
    return null;
  }
  if (info.isToday){
    daysEl.textContent = "🎂 就是今天！";
    daysEl.title = "农历九月廿八 · 今天";
    var ll = $("#lunarLine");
    if (ll) ll.textContent = "— 今天是农历九月廿八 · 俊贤 " + CONFIG.age + " 岁生日快乐！—";
    return 0;
  }
  daysEl.textContent = "🎂 " + info.days + " 天";
  daysEl.title = "农历九月廿八 · " + info.date.m + "月" + info.date.d + "日";
  var lunarLine = $("#lunarLine");
  if (lunarLine) lunarLine.textContent = "— 农历九月廿八（" + info.date.m + " 月 " + info.date.d + " 日）还有 " + info.days + " 天 —";
  return info.days;
}

/* ===================== 启动 ===================== */
function unlock(){
  if (!S.unlocked){ S.unlocked = true; ac(); }
}
function start(){
  var welcome = $("#welcome");
  welcome.classList.add("hide");
  unlock();
  greet();
  if (updateDays() === 0){
    setTimeout(function(){ goScene(4); }, 700);
    setTimeout(function(){ blowCandles(); }, 1800);
  }
  showToast("左手点左下角圆盘，让 Pingu 动起来 🖐️");
}
function boot(){
  buildNav();
  fitStage();
  setupMic();
  var params = new URLSearchParams(location.search);
  var sceneParam = params.get("scene") || params.get("s");
  var nointro = params.get("nointro") === "1" || !!sceneParam;
  var hash = (location.hash || "").replace(/^#/, "");
  if (hash){ sceneParam = hash.replace(/^scene=/, ""); nointro = true; }
  var startScene = 0;
  if (sceneParam){
    for (var i = 0; i < SCENES.length; i++) if (SCENES[i].id === sceneParam) startScene = i;
  }
  renderScene(startScene, { silent: nointro });
  var days = updateDays();

  $("#greetBtn").addEventListener("click", function(e){ e.stopPropagation(); greet(); });
  $("#startBtn").addEventListener("click", function(e){ e.stopPropagation(); start(); });

  pad.addEventListener("pointerdown", padDown);
  pad.addEventListener("pointermove", padMove);
  pad.addEventListener("pointerup", padUp);
  pad.addEventListener("pointercancel", padUp);
  pad.addEventListener("lostpointercapture", padUp);

  stageWrap.addEventListener("pointerdown", stageDown);
  window.addEventListener("pointermove", stageMove);
  window.addEventListener("pointerup", stageUp);
  window.addEventListener("pointercancel", stageCancel);
  window.addEventListener("resize", fitStage);
  window.addEventListener("orientationchange", function(){ setTimeout(fitStage, 150); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fitStage);

  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") goScene(S.scene + 1);
    else if (e.key === "ArrowLeft") goScene(S.scene - 1);
    else if (e.key === " "){ e.preventDefault(); triggerPhase(); }
    else if (e.key === "g" || e.key === "G") greet();
    else if (/^[1-5]$/.test(e.key)){ padGesture.pts.set("key" + e.key, {x:0,y:0}); refreshPadDots(); padGesture.pts.delete("key" + e.key); triggerPhase(); }
  });

  if (nointro){
    var wl = $("#welcome");
    wl.classList.add("hide");
    wl.style.display = "none";
    S.unlocked = true;
  }
  window.__pingu = {
    S: S, goScene: goScene, trigger: triggerPhase, greet: greet, blow: blowCandles, egg: easterEgg,
    // 给隔空手势模块复用的两个入口（等价于点击圆盘 / 右手滑动）
    doAction: triggerPhase,
    nextCharacter: function (d) { goScene(S.scene + (d || 1)); }
  };
  requestAnimationFrame(loop);
}

function err(msg){
  // 隔空手势模块的资源加载错误由模块自己提示，不再顶红条吓人
  if (/hands_solution|createMediapipe|packed_assets|MediaPipe/i.test(msg)) {
    console.warn("[gesture]", msg);
    return;
  }
  errbar.style.display = "block";
  errbar.textContent = "出错啦：" + msg;
}
window.addEventListener("error", function(e){ err("JS异常：" + (e.message || "")); });
window.addEventListener("unhandledrejection", function(e){ err("Promise异常：" + String(e.reason)); });

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
})();
</script>
<script>/* ==========================================================================
   隔空手势模块 · GestureMediaPipe
   --------------------------------------------------------------------------
   独立增量模块：不修改原有 CONFIG / SCENES / ACTIONS / WebAudio / 农历逻辑，
   只作为"额外输入方式"：
     · 左手（handedness = Left）指尖位移  → 调用 window.__pingu.doAction()
     · 右手（handedness = Right）横向滑动 → 调用 window.__pingu.nextCharacter(±1)

   依赖：MediaPipe Hands（CDN：hands.js + wasm 资源）
   生效条件：HTTPS / localhost 且浏览器支持摄像头；http 下按钮自动隐藏。
   ========================================================================== */
(function () {
  "use strict";

  /* ---------------- 可调参数 ---------------- */
  var CFG = {
    CDN: [
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/",
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/",
      "https://unpkg.com/@mediapipe/hands@0.4.1646424915/",
      "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
    ],

    SWAP_HANDS: false,      // 如果左右手识别反了：改成 true
    INVERT_SWIPE: false,    // 如果右手滑动方向反了：改成 true

    /* 防误识别：只有"像真手、并且确实在动"才触发 */
    MIN_HAND_SCORE: 0.45,        // handedness 置信度（实测真实举手常只有 0.5 左右）
    HAND_MIN_SPAN: 0.06,         // 手腕→中指根至少占画面 6%
    HAND_MAX_SPAN: 0.9,
    HAND_CONFIRM_FRAMES: 3,      // 连续 3 帧都检测到同一只手才算数
    HAND_CENTER_MARGIN: 0.06,    // 手要在画面中间区域（排除画面边缘拿手机的手）
    FINGER_MIN: 2,               // 至少 2 根手指伸展（张开手掌才算"准备好了"）
    ARM_FRAMES: 8,               // 连续 8 帧合格后才"就绪"（约 0.3 秒）
    ARM_IDLE_RESET_MS: 700,      // 手离开画面 0.7 秒后解除就绪、需要重新举手

    LEFT_MOVE_THRESHOLD: 0.09,   // 左手指尖 240ms 内位移超过画面 9%
    LEFT_WINDOW_MS: 240,
    LEFT_SHORT_MS: 80,           // 短窗口：确认此刻还在往同一方向动
    LEFT_SHORT_MIN: 0.02,
    LEFT_COOLDOWN_MS: 600,       // 左手防抖冷却（按要求 0.6s）

    RIGHT_SWIPE_X: 0.16,         // 右手横向滑动阈值（画面宽度 16%）
    RIGHT_WINDOW_MS: 380,        // 滑动观察窗口
    RIGHT_SHORT_MS: 90,
    RIGHT_SHORT_MIN: 0.02,
    RIGHT_COOLDOWN_MS: 700,      // 右手切换冷却

    HAND_SETTLE_MS: 350,         // 手刚进入画面先稳定，避免抬手被误判
    SEND_INTERVAL_MS: 45,        // 送帧节流 ≈22fps
    MAX_NUM_HANDS: 2,
    SELFIE_MODE: true,
    MODEL_COMPLEXITY: 0,

    /* 本地 MediaPipe Tasks Vision（来自 bloom-gesture-kit，Apache-2.0）
       优先用本地模型（不依赖 CDN），失败再回退旧版 CDN Hands */
    TASKS_BUNDLE: "./gesture/lib/vision_bundle.mjs",
    TASKS_WASM: "./gesture/lib/wasm/",
    TASKS_MODEL: "./gesture/models/hand_landmarker.task"
  };

  var TIP = 8;  // 食指指尖
  var HAND_CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  var API = { active: false, starting: false, error: "" };
  var els = {};
  var hands = null;
  var landmarker = null;
  var engine = "";       // "tasks" | "legacy"
  var stream = null;
  var rafId = 0;
  var lastSend = 0;
  var cdnBase = "";
  var session = 0;
  var firstResultShown = false;
  var lastLeft = 0, lastRight = 0;

    Left:  { samples: [], visible: false, seenAt: 0, enterAt: 0, frames: 0, armed: false },
    Right: { samples: [], visible: false, seenAt: 0, enterAt: 0, frames: 0, armed: false }
  };
  var initWatchdog = 0;
  var startGuard = 0;
  var resultCount = 0;
  var startedAt = 0;

  function byId(id) { return document.getElementById(id); }
  function now() { return performance.now(); }

  /* ---------------- MediaPipe 资源加载兼容层 ----------------
     旧版 hands.js 会动态注入 wasm/资源脚本；个别浏览器/网络下资源加载器

  function installAssetShim() {
    try {
      var real = undefined;
      Object.defineProperty(window, "createMediapipeSolutionsPackedAssets", {
        configurable: true,
        get: function () { return real; },
        set: function (v) {
          try {

    } catch (e) {}
  }

      navigator.mediaDevices &&
      typeof navigator.mediaDevices.getUserMedia === "function");
  }

  /* ---------------- 注入 UI（新增元素，不改原有 DOM 结构） ---------------- */

      ".g-btn{flex:none;width:58px;height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.65);",

      "background:#000;border:2px solid rgba(255,255,255,.75);box-shadow:0 8px 20px rgba(0,0,0,.28);}",
      ".g-cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}",
      ".g-cam canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}",

      ".g-msg{position:fixed;left:50%;bottom:29%;transform:translate(-50%,8px);z-index:40;max-width:86vw;",

  /* 开启后把页面底部提示改成手势说明，关闭时恢复 */

  /* ---------------- 加载 MediaPipe Hands ---------------- */
  function loadScript(base) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var s = document.createElement("script");
      s.src = base + "hands.js";
      s.async = true;
      function finish(ok, err) {
        if (done) return;
        done = true;
        if (ok) resolve(base);
        else reject(err || new Error("加载失败"));
      }
      s.onload = function () { finish(true); };
      s.onerror = function () { finish(false, new Error("无法加载 " + s.src)); };
      // 网络被拦截时 onerror 可能不触发，这里兜一个超时
      setTimeout(function () { finish(false, new Error("加载超时：cdn.jsdelivr.net 访问不了")); }, 9000);
      document.head.appendChild(s);
    });
  }

  function loadMediaPipe() {
    if (typeof window.Hands === "function") {
      return Promise.resolve(cdnBase || CFG.CDN[0]);
    }
    var i = 0;
    function next() {
      if (i >= CFG.CDN.length) return Promise.reject(new Error("手势模型加载失败，请检查网络"));
      var base = CFG.CDN[i++];
      return loadScript(base).catch(function () { return next(); });
    }
    return next();
  }

    return new Promise(function (resolve) {

      var done = false;
      function go() { if (!done) { done = true; resolve(); } }
      video.addEventListener("loadeddata", go, { once: true });

    if (location.protocol === "file:") {
      return "\n当前是 file:// 直接打开，浏览器会限制手势模型加载。\n请双击「启动手机版.bat」，改用 http://127.0.0.1:8000 打开；手机使用 https 网址。";
    }
    return "\n请确认网络能访问 cdn.jsdelivr.net；也可以刷新页面后再试。";
  }

  function fail(msg, long) {
    API.error = msg;
    cleanup();
    setBtn("off");
    say("开启失败：" + msg + (long === false ? "" : protocolHint()), long === false ? 4200 : 9000);
  }

  /* ---------------- 启动 / 关闭 ---------------- */
  function start() {
    if (API.active || API.starting) return;
    if (!supported()) { say("隔空手势需要 HTTPS 或 localhost 环境"); return; }
    if (typeof window.__pingu === "undefined") { say("页面还没准备好，请稍后再试"); return; }

    var my = ++session;
    API.starting = true;
    API.error = "";
    resultCount = 0;
    setBtn("busy");
    say("正在启动摄像头并加载手势模型…", 60000);
    installAssetShim();
    clearTimeout(startGuard);
    startGuard = setTimeout(function () {
      if (my === session && API.starting) {
        fail("加载超时（本地模型或网络异常）");
      }
    }, 25000);

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    })
      .then(function (s) {
        if (my !== session) { try { s.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
        stream = s;
        els.cam.hidden = false;
        els.video.srcObject = s;
        return els.video.play();
      })
      .then(function () {
        if (my !== session) return;
        return waitVideoReady(els.video);
      })
      .then(function () {
        if (my !== session) return;
        return initEngine();
      })
      .then(function () {
        if (my !== session) return;
        API.active = true;
        API.starting = false;
        startedAt = now();
        els.cam.hidden = false;
        sizeCanvas();
        setBtn("on");
        var uaWarn = /MicroMessenger|QQBrowser|Quark|UCBrowser|baidubrowser|; wv\)/i.test(navigator.userAgent)
          ? "\n\n⚠️ 检测到你在 App 内置浏览器里，手势识别可能不稳定，建议用 Chrome / Edge / Safari 打开。"
          : "";
        say("隔空手势已开启\n① 左手：张开手掌举到画面中间，动动手指 = Pingu 做动作\n② 右手：张开手掌，从左往右（或从右往左）滑一下 = 换下一只" + uaWarn, 12000);
        setFooterHint("左手动指=动作 · 右手横滑=换一只");
        startWatchdog(my);
        pump();
      })
      .catch(function (err) {
        if (my !== session) return;
        console.warn("[gesture]", err);
        var msg = (err && err.message) || "启动失败";
        // 常见错误翻译成更好懂的话
        if (/Permission|NotAllowed/i.test(msg)) msg = "摄像头权限被拒绝，请在浏览器地址栏允许摄像头";
        else if (/NotFound|Requested device/i.test(msg)) msg = "没有找到摄像头";
        else if (/packed_assets|Cannot read properties/i.test(msg)) msg = "手势模型资源加载失败（网络或 file:// 限制）";
        fail(msg);
      });  }

  /* ---------------- 手势引擎：优先本地 Tasks Vision，失败回退 CDN Hands ---------------- */
  function absoluteURL(p) {
    try { return new URL(p, location.href).href; } catch (e) { return p; }
  }

  function initEngine() {
    return initTasks().catch(function (err) {
      console.warn("[gesture] Tasks Vision 不可用，回退 CDN Hands:", err && err.message);
      return initLegacy();
    });
  }

  function initTasks() {
    return import(absoluteURL(CFG.TASKS_BUNDLE)).then(function (mod) {
      if (!mod || !mod.FilesetResolver || !mod.HandLandmarker) throw new Error("Tasks Vision 模块无效");
      return mod.FilesetResolver.forVisionTasks(absoluteURL(CFG.TASKS_WASM)).then(function (fileset) {
        var options = {
          baseOptions: {
            modelAssetPath: absoluteURL(CFG.TASKS_MODEL),
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: CFG.MAX_NUM_HANDS,
          minHandDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        };
        return mod.HandLandmarker.createFromOptions(fileset, options).catch(function () {
          options.baseOptions.delegate = "CPU";
          return mod.HandLandmarker.createFromOptions(fileset, options);
        }).then(function (lm) {
          landmarker = lm;
          engine = "tasks";
        });
      });
    });
  }

  function initLegacy() {
    return loadMediaPipe().then(function (base) {
      cdnBase = base;
      if (typeof window.Hands !== "function") throw new Error("MediaPipe 初始化失败（CDN 脚本没执行）");
      hands = new window.Hands({ locateFile: function (file) { return cdnBase + file; } });
      hands.setOptions({
        maxNumHands: CFG.MAX_NUM_HANDS,
        modelComplexity: CFG.MODEL_COMPLEXITY,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6,
        selfieMode: CFG.SELFIE_MODE
      });
      hands.onResults(onResults);
      engine = "legacy";
      return (typeof hands.initialize === "function") ? hands.initialize() : null;
    });
  }

  function startWatchdog(my) {
    clearTimeout(initWatchdog);
    initWatchdog = setTimeout(function () {
      if (my !== session || !API.active) return;
      if (resultCount > 0) return;
      fail("手势模型没有返回结果", false);
      say("手势模型已加载，但一直没有识别结果。\n请把整只手放进画面、光线亮一点；如果还不行，换 Chrome 或检查网络后刷新重试。", 9000);
    }, 18000);
  }

  function cleanup() {
    API.active = false;
    API.starting = false;
    clearTimeout(initWatchdog);
    clearTimeout(startGuard);
    restoreFooterHint();
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    try { if (hands && hands.close) hands.close(); } catch (e) {}
    hands = null;
    try { if (landmarker && landmarker.close) landmarker.close(); } catch (e) {}
    landmarker = null;
    engine = "";
    if (stream) {
      try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      stream = null;
    }
    if (els.video) { try { els.video.srcObject = null; } catch (e) {} }
    if (els.cam) els.cam.hidden = true;
    resetTrack(tracks.Left);
    resetTrack(tracks.Right);
    firstResultShown = false;
  }

  function resetTrack(st) {
    st.samples.length = 0;
    st.visible = false;
    st.enterAt = 0;
    st.frames = 0;
    st.armed = false;
  }

  function stop() {
    if (!API.active && !API.starting) return;
    session++;
    cleanup();
    setBtn("off");
    say("已关闭隔空手势，点击圆盘玩法照旧", 2600);
  }

  /* ---------------- 送帧 ---------------- */
  function pump() {
    if (!API.active) return;
    rafId = requestAnimationFrame(pump);
    if (document.hidden) return;
    var v = els.video;
    if (!v || v.readyState < 2 || !v.videoWidth) return;
    var t = now();
    if (t - lastSend < CFG.SEND_INTERVAL_MS) return;
    lastSend = t;
    try {
      if (engine === "legacy" && hands) {
        var p = hands.send({ image: v });
        if (p && p.catch) p.catch(function () {});
      } else if (engine === "tasks" && landmarker) {
        var res = landmarker.detectForVideo(v, performance.now());
        if (res) {
          var mapped = (res.handednesses || []).map(function (h) {
            var c = (h && h[0]) || h || {};
            return { label: c.categoryName || c.label, score: c.score };
          });
          onResults({ multiHandLandmarks: res.landmarks || [], multiHandedness: mapped });
        }
      }
    } catch (e) {
      console.warn("[gesture] detect error", e && e.message);
    }
  }

  /* ---------------- 识别结果 ---------------- */
  function d2(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* 数一数有几根手指是伸开的（张开手掌） */
  function fingersExtended(lm) {
    var wrist = lm[0], n = 0;
    var pairs = [[8, 6], [12, 10], [16, 14], [20, 18]];
    for (var i = 0; i < pairs.length; i++) {
      var tip = lm[pairs[i][0]], pip = lm[pairs[i][1]];
      if (d2(tip, wrist) > d2(pip, wrist) * 1.12) n++;
    }
    if (d2(lm[4], wrist) > d2(lm[2], wrist) * 1.05) n++;  // 大拇指
    return n;
  }

  /* 是不是"真的有一只手举在画面中间"（过滤误检 / 画面边缘的手） */
  function handOk(lm, hd) {
    if (!hd || hd.score < CFG.MIN_HAND_SCORE) return false;
    var span = d2(lm[0], lm[9]);              // 手腕 → 中指根
    if (span < CFG.HAND_MIN_SPAN || span > CFG.HAND_MAX_SPAN) return false;
    if (fingersExtended(lm) < CFG.FINGER_MIN) return false;  // 没张开手掌不算
    var cx = (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5;
    var cy = (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5;
    var m = CFG.HAND_CENTER_MARGIN;
    if (cx < m || cx > 1 - m) return false;
    if (cy < 0.08 || cy > 0.92) return false; // 太靠上/太靠下（比如拿手机的手）都不算
    for (var i = 0; i < 21; i++) {
      if (lm[i].x < -0.04 || lm[i].x > 1.04 || lm[i].y < -0.04 || lm[i].y > 1.04) return false;
    }
    return true;
  }

  /* ---------------- 小窗里的手部骨架（让弟弟看到"识别到了哪只手"） ---------------- */
  function sizeCanvas() {
    if (!els.canvas || !els.cam) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    els.canvas.width = Math.round((els.cam.clientWidth || 104) * dpr);
    els.canvas.height = Math.round((els.cam.clientHeight || 78) * dpr);
  }
  function drawHands(hands) {
    if (!els.ctx2d || !els.canvas) return;
    var c = els.ctx2d, W = els.canvas.width, H = els.canvas.height;
    c.clearRect(0, 0, W, H);
    for (var k = 0; k < hands.length; k++) {
      var lm = hands[k].lm, label = hands[k].label, ok = hands[k].ok;
      var color = !ok ? "rgba(255,255,255,.45)"
        : (label === "Left" ? "#7bdff2" : "#ffd166");
      c.strokeStyle = color; c.lineWidth = Math.max(1.5, W / 90); c.globalAlpha = .95;
      for (var i = 0; i < HAND_CONNECTIONS.length; i++) {
        var a = lm[HAND_CONNECTIONS[i][0]], b = lm[HAND_CONNECTIONS[i][1]];
        c.beginPath();
        c.moveTo((1 - a.x) * W, a.y * H);   // 视频是镜像显示的，坐标也镜像
        c.lineTo((1 - b.x) * W, b.y * H);
        c.stroke();
      }
      c.fillStyle = color;
      for (var j = 0; j < lm.length; j++) {
        c.beginPath();
        c.arc((1 - lm[j].x) * W, lm[j].y * H, Math.max(1.2, W / 110), 0, 6.283);
        c.fill();
      }
      c.globalAlpha = 1;
      c.font = "bold " + Math.round(W / 12) + "px system-ui,sans-serif";
      c.fillStyle = color;
      var mark = label === "Left" ? "左" : (label === "Right" ? "右" : "?");
      c.fillText(mark, (1 - lm[0].x) * W - W / 12, Math.max(12, lm[0].y * H + H / 8));
    }
  }

  function onResults(res) {
    if (!res || !res.multiHandLandmarks) return;
    resultCount++;
    clearTimeout(initWatchdog);
    if (!firstResultShown) {
      firstResultShown = true;
      say("已识别摄像头画面，举起手掌试试 ✋", 2600);
    }
    var t = now();
    var seenLeft = false, seenRight = false;
    var drawn = [], rawCount = 0, okCount = 0;

    for (var i = 0; i < res.multiHandLandmarks.length; i++) {
      var lm = res.multiHandLandmarks[i];
      if (!lm || lm.length < 21) continue;
      rawCount++;
      var hd = res.multiHandedness && res.multiHandedness[i];
      var label = hd && (hd.label || hd.categoryName) ? (hd.label || hd.categoryName) : "?";
      if (label !== "?") {
        if (CFG.SWAP_HANDS) label = (label === "Left") ? "Right" : "Left";
        drawn.push({ lm: lm, label: label, ok: handOk(lm, hd) });
      }
      if (!handOk(lm, hd)) continue;           // 不像真手 → 不参与触发
      okCount++;
      if (label === "Left") { seenLeft = true; trackLeft(lm, t); }
      else if (label === "Right") { seenRight = true; trackRight(lm, t); }
    }
    drawHands(drawn);

    if (!seenLeft && t - tracks.Left.seenAt > CFG.ARM_IDLE_RESET_MS) resetTrack(tracks.Left);
    if (!seenRight && t - tracks.Right.seenAt > CFG.ARM_IDLE_RESET_MS) resetTrack(tracks.Right);

    if (t - lastHint > 220) {
      lastHint = t;
      var L = tracks.Left, R = tracks.Right;
      if (resultCount === 0) {
        els.hint.textContent = (startedAt && now() - startedAt > 8000)
          ? "模型没出结果 · 换 Chrome 试试"
          : "模型启动中…";
      } else if (rawCount === 0) {
        els.hint.textContent = "举起手掌试试";
      } else if (okCount === 0) {
        els.hint.textContent = "手靠近一点，张开手掌";
      } else if (!L.armed && !R.armed) {
        els.hint.textContent = "保持手掌 0.3 秒…";
      } else if (L.armed && R.armed) {
        els.hint.textContent = "双手就绪 ✓";
      } else if (L.armed) {
        els.hint.textContent = "左手 ✓ 动动手指";
      } else {
        els.hint.textContent = "右手 ✓ 横向滑";
      }
    }
  }

  /* ---------------- 左手：指尖位移 ---------------- */
  function pushSample(st, x, y, t) {
    st.samples.push({ t: t, x: x, y: y });
    var cut = t - 900;
    while (st.samples.length && st.samples[0].t < cut) st.samples.shift();
  }

  function sampleNear(st, target, tol) {
    var best = null, bd = 1e9;
    for (var i = 0; i < st.samples.length; i++) {
      var d = Math.abs(st.samples[i].t - target);
      if (d < bd) { bd = d; best = st.samples[i]; }
    }
    return (best && bd <= tol) ? best : null;
  }

  function trackLeft(lm, t) {
    var st = tracks.Left;
    var p = lm[TIP];
    pushSample(st, p.x, p.y, t);
    st.seenAt = t;
    st.frames = (st.frames || 0) + 1;
    if (!st.visible) { st.visible = true; st.enterAt = t; return; }
    if (st.frames < CFG.ARM_FRAMES) return;          // 先"举手就绪"
    if (t - st.enterAt < CFG.HAND_SETTLE_MS) return;
    st.armed = true;
    if (t - lastLeft < CFG.LEFT_COOLDOWN_MS) return;
    var ref = sampleNear(st, t - CFG.LEFT_WINDOW_MS, 150);
    var near = sampleNear(st, t - CFG.LEFT_SHORT_MS, 80);
    if (!ref || !near) return;
    var dx = p.x - ref.x, dy = p.y - ref.y;
    var sx = p.x - near.x, sy = p.y - near.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var slen = Math.sqrt(sx * sx + sy * sy);
    // 长窗口要够远、短窗口还在往同一方向动（排除关键点抖动造成的假动作）
    if (len > CFG.LEFT_MOVE_THRESHOLD && slen > CFG.LEFT_SHORT_MIN && (dx * sx + dy * sy) > 0) {
      lastLeft = t;
      fireLeft();
    }
  }

  /* ---------------- 右手：横向滑动 ---------------- */
  function trackRight(lm, t) {
    var st = tracks.Right;
    var p = lm[TIP];
    pushSample(st, p.x, p.y, t);
    st.seenAt = t;
    st.frames = (st.frames || 0) + 1;
    if (!st.visible) { st.visible = true; st.enterAt = t; return; }
    if (st.frames < CFG.ARM_FRAMES) return;
    if (t - st.enterAt < CFG.HAND_SETTLE_MS) return;
    st.armed = true;
    if (t - lastRight < CFG.RIGHT_COOLDOWN_MS) return;
    var ref = sampleNear(st, t - CFG.RIGHT_WINDOW_MS, 200);
    var near = sampleNear(st, t - CFG.RIGHT_SHORT_MS, 90);
    if (!ref || !near) return;
    var dx = p.x - ref.x, dy = p.y - ref.y;
    var sx = p.x - near.x;
    if (Math.abs(dx) > CFG.RIGHT_SWIPE_X && Math.abs(dx) > Math.abs(dy) * 1.8
        && Math.abs(sx) > CFG.RIGHT_SHORT_MIN && (sx * dx) > 0) {
      lastRight = t;
      fireRight(dx);
    }
  }

  /* ---------------- 调用原有逻辑（只读调用，不改原代码） ---------------- */
  function fireLeft() {
    var api = window.__pingu;
    if (!api || !api.doAction) return;
    api.doAction();                 // 等价于点击左下圆盘：A/B 动作切换
    if (els.hint) els.hint.textContent = "左手 · 动作";
  }

  function fireRight(dx) {
    var api = window.__pingu;
    if (!api || !api.nextCharacter) return;
    var dir = dx > 0 ? 1 : -1;
    if (CFG.INVERT_SWIPE) dir = -dir;
    api.nextCharacter(dir);         // 等价于右手滑动：切下一只 Pingu
    if (els.hint) els.hint.textContent = dir > 0 ? "右手 · 下一只 →" : "← 右手 · 上一只";
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    installAssetShim();
    injectUI();
    if (!supported()) {
      if (els.btn) els.btn.hidden = true;  // http：自动隐藏，原玩法不受影响
      return;
    }
    els.btn.hidden = false;
    els.btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (API.active || API.starting) stop();
      else start();
    });
    window.addEventListener("resize", function () { if (API.active) sizeCanvas(); });
    // MediaPipe 资源加载器偶尔会异步抛错，这里单独兜住，给出可理解的提示
    window.addEventListener("error", function (ev) {
      var msg = (ev && (ev.message || "")) + "";
      if (/hands_solution|createMediapipe|packed_assets|MediaPipe/i.test(msg)) {
        if (API.starting || API.active) {
          console.warn("[gesture] async asset error:", msg);
          fail("手势模型资源加载失败", false);
          say("手势模型资源加载失败：可能是网络拦截或 file:// 限制。\n请改用本地服务器打开（http://127.0.0.1:8000）或部署到 https 再试。", 9000);
        }
      }
    }, true);
  }

  /* 构造一只"测试用"的手：21 个点按真实手型铺开，便于单元测试 */
  function makeSyntheticHand(x, y) {
    var lm = [];
    for (var i = 0; i < 21; i++) lm.push({ x: x, y: y, z: 0 });
    lm[0] = { x: x - 0.02, y: y + 0.14, z: 0 };                 // 手腕
    lm[1] = { x: x - 0.10, y: y + 0.05, z: 0 };
    lm[2] = { x: x - 0.12, y: y + 0.01, z: 0 };
    lm[3] = { x: x - 0.13, y: y - 0.02, z: 0 };
    lm[4] = { x: x - 0.14, y: y - 0.04, z: 0 };
    lm[5] = { x: x - 0.06, y: y - 0.02, z: 0 };
    lm[6] = { x: x - 0.07, y: y - 0.06, z: 0 };
    lm[7] = { x: x - 0.07, y: y - 0.09, z: 0 };
    lm[8] = { x: x - 0.07, y: y - 0.12, z: 0 };                 // 食指指尖
    lm[9] = { x: x, y: y - 0.02, z: 0 };                        // 中指根
    lm[10] = { x: x, y: y - 0.07, z: 0 };
    lm[11] = { x: x, y: y - 0.10, z: 0 };
    lm[12] = { x: x, y: y - 0.12, z: 0 };
    lm[13] = { x: x + 0.05, y: y - 0.01, z: 0 };
    lm[14] = { x: x + 0.06, y: y - 0.05, z: 0 };
    lm[15] = { x: x + 0.06, y: y - 0.08, z: 0 };
    lm[16] = { x: x + 0.06, y: y - 0.10, z: 0 };
    lm[17] = { x: x + 0.10, y: y + 0.02, z: 0 };
    lm[18] = { x: x + 0.12, y: y - 0.01, z: 0 };
    lm[19] = { x: x + 0.13, y: y - 0.03, z: 0 };
    lm[20] = { x: x + 0.13, y: y - 0.05, z: 0 };
    return lm;
  }

  window.GestureMediaPipe = {
    supported: supported,
    start: start,
    stop: stop,
    config: CFG,
    state: function () {
      return {
        supported: supported(), active: API.active, starting: API.starting, error: API.error,
        left: tracks.Left.visible, right: tracks.Right.visible, cdn: cdnBase,
        results: resultCount, protocol: location.protocol, engine: engine
      };
    },
    // 仅测试用：喂一个归一化坐标（会完整走 handOk 防误识别检查）
    _testFeed: function (label, x, y) {
      var t = now();
      if (CFG.SWAP_HANDS) label = (label === "Left") ? "Right" : "Left";
      var lm = makeSyntheticHand(x, y);
      var hd = { score: 1, label: label };
      if (!handOk(lm, hd)) return false;
      if (label === "Left") trackLeft(lm, t);
      else trackRight(lm, t);
      return true;
    },
    // 仅测试用：构造"不像手"的输入（例如画面边缘、很小），应被拒绝
    _testFeedRaw: function (label, x, y, span) {
      var t = now();
      var lm = [];
      for (var i = 0; i < 21; i++) lm.push({ x: x, y: y, z: 0 });
      lm[0] = { x: x, y: y };
      lm[9] = { x: x, y: y - (span || 0.02) };
      var hd = { score: 0.99, label: label };
      if (!handOk(lm, hd)) return false;
      if (label === "Left") trackLeft(lm, t);
      else trackRight(lm, t);
      return true;
    },
    _resetTest: function () {
      resetTrack(tracks.Left); resetTrack(tracks.Right);
      lastLeft = 0; lastRight = 0;
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { setTimeout(init, 0); });
  } else {
    setTimeout(init, 0);
  }
})();
</script>
</body>
</html>
